# Construit et publie le site EMC Studio à chaque modification du dépôt.
# Sources : seances/ (texte, patchs, images) + _atelier/ (générateur, feuille de style).
# Réglage nécessaire une seule fois : Settings › Pages › Source = « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                # un seul déploiement à la fois ; le plus récent gagne
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _atelier/requirements.txt

      - name: Installer les outils (Markdown, YAML, Playwright + Chromium)
        run: |
          pip install -r _atelier/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji

      - name: Construire les pages
        run: python _atelier/build.py seances _site _atelier/assets

      - name: Fabriquer les PDF
        run: python _atelier/pdf.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
